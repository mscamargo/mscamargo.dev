        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Marcos Camargo",

                "jobTitle": "Backend Engineer",
                "email": "mailto:mscamargo.dev@gmail.com",
                "sameAs": [
                    "https://github.com/mscamargo",

                    "https://www.youtube.com/@mscamargo",
                    "https://www.instagram.com/omscamargo.dev"
                ]
            }
        </script>

        <style>
            :root {
                --ink: #06060b;
                --pink: 255, 60, 190;
                --cyan: 70, 220, 255;
                --mint: 120, 255, 190;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                background: var(--ink);
            }

            body {
                margin: 0;
                min-height: 100svh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: clamp(2rem, 8vh, 5rem) clamp(1.25rem, 6vw, 4rem);
                background: var(--ink);
                color: #eef0fa;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                -webkit-text-size-adjust: 100%;
            }

            /* two low, wide neon sources — the only colour on the page */
            body::before {
                content: "";
                position: fixed;
                inset: -20%;
                z-index: -2;
                pointer-events: none;
                background:
                    radial-gradient(
                        40rem 26rem at 34% 40%,
                        rgba(var(--pink), 0.2),
                        transparent 68%
                    ),
                    radial-gradient(
                        36rem 24rem at 70% 62%,
                        rgba(var(--cyan), 0.15),
                        transparent 68%
                    );
            }

            /* a sheet of glass laid across the middle of the frame; its edges
               are masked away, so it frosts the light without drawing a box */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;
                background: rgba(255, 255, 255, 0.018);
                -webkit-backdrop-filter: blur(60px) saturate(140%);
                backdrop-filter: blur(60px) saturate(140%);
                -webkit-mask-image: linear-gradient(
                    180deg,
                    transparent,
                    #000 26%,
                    #000 74%,
                    transparent
                );
                mask-image: linear-gradient(
                    180deg,
                    transparent,
                    #000 26%,
                    #000 74%,
                    transparent
                );
            }

            .block {
                width: fit-content;
                max-width: 100%;
            }

            h1 {
                margin: 0;
                font-family: "Orbitron", system-ui, sans-serif;
                font-weight: 800;
                text-transform: uppercase;
                font-size: clamp(1.6rem, 7.4vw, 5rem);
                line-height: 1.14;
                letter-spacing: -0.01em;
                /* glass: lit along the top edge, falling to a cool shadow.
                   sized to one line and repeated, so both lines catch the
                   same sheen instead of the second one sinking to grey */
                background: linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #f2f4ff 46%,
                    #cdd4f0 64%,
                    #aab3d8 100%
                );
                background-size: 100% 50%;
                background-repeat: repeat-y;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                -webkit-text-fill-color: transparent;
                /* the neon reads as a fringe along the edges — a wider halo
                   just fuses the two lines into a glowing slab */
                filter: drop-shadow(-1.5px 0 4px rgba(var(--pink), 0.6))
                    drop-shadow(1.5px 0 4px rgba(var(--cyan), 0.5));
            }

            .links {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 1rem;
                margin-top: clamp(2.5rem, 8vh, 4.5rem);
                font-size: clamp(0.68rem, 1.5vw, 0.82rem);
                font-weight: 600;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }

            .link {
                padding: 0;
                border: 0;
                background: none;
                color: rgba(238, 240, 250, 0.72);
                font: inherit;
                letter-spacing: inherit;
                text-transform: inherit;
                text-decoration: none;
                white-space: nowrap;
                cursor: pointer;
                transition:
                    color 0.2s ease,
                    text-shadow 0.2s ease;
            }

            /* the brackets are always in the layout, so nothing shifts when
               they light up */
            .link::before,
            .link::after {
                color: rgb(var(--cyan));
                opacity: 0;
                transition: opacity 0.2s ease;
            }

            .link::before {
                content: "[ ";
            }

            .link::after {
                content: " ]";
            }

            .link:hover,
            .link:focus-visible {
                outline: none;
                color: #ffffff;
                text-shadow:
                    0 0 12px rgba(var(--cyan), 0.55),
                    0 0 28px rgba(var(--cyan), 0.25);
            }

            .link:hover::before,
            .link:hover::after,
            .link:focus-visible::before,
            .link:focus-visible::after {
                opacity: 1;
            }

            .link.copied,
            .link.copied:hover {
                color: rgb(var(--mint));
                text-shadow:
                    0 0 12px rgba(var(--mint), 0.55),
                    0 0 28px rgba(var(--mint), 0.25);
            }

            .link.copied::before,
            .link.copied::after {
                color: rgb(var(--mint));
                opacity: 1;
            }

            .sr-status {
                position: absolute;
                width: 1px;
                height: 1px;
                margin: -1px;
                padding: 0;
                border: 0;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }

            /* the row runs out of air before the headline does */
            @media (max-width: 540px) {
                .links {
                    letter-spacing: 0.1em;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .link,
                .link::before,
                .link::after {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <main class="block">
            <h1>think twice,<br />code once.</h1>

            <nav class="links" aria-label="Profiles and contact">
                <a
                    class="link"
                    href="https://www.linkedin.com/in/mscamargo/"
                    target="_blank"
                    rel="noopener"
                    >linkedin</a
                >

                <a
                    class="link"
                    href="https://github.com/mscamargo"
                    target="_blank"
                    rel="noopener"
                    >github</a
                >

                <button
                    class="link"
                    type="button"
                    id="email-btn"
                    data-email="mscamargo.dev@gmail.com"
                    title="mscamargo.dev@gmail.com"
                    aria-label="Copy email mscamargo.dev@gmail.com"
                >
                    e-mail
                </button>
            </nav>

            <p class="sr-status" role="status" aria-live="polite"></p>
        </main>

        <script>
            (function () {
                var btn = document.getElementById("email-btn");
                var status = document.querySelector(".sr-status");
                var email = btn.dataset.email;
                var label = btn.textContent;
                var timer;

                function confirmed() {
                    btn.classList.add("copied");
                    btn.textContent = "copied";
                    status.textContent = "Email copied";
                    clearTimeout(timer);
                    timer = setTimeout(function () {
                        btn.classList.remove("copied");
                        btn.textContent = label;
                        status.textContent = "";
                    }, 1800);
                }

                function legacyCopy() {
                    var input = document.createElement("input");
                    input.value = email;
                    input.setAttribute("readonly", "");
                    input.style.position = "fixed";
                    input.style.opacity = "0";
                    document.body.appendChild(input);
                    input.select();
                    var ok = false;
                    try {
                        ok = document.execCommand("copy");
                    } catch (e) {
                        ok = false;
                    }
                    document.body.removeChild(input);
                    return ok;
                }

                btn.addEventListener("click", function () {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard
                            .writeText(email)
                            .then(confirmed, function () {
                                if (legacyCopy()) confirmed();
                                else window.location.href = "mailto:" + email;
                            });
                    } else if (legacyCopy()) {
                        confirmed();
                    } else {
                        window.location.href = "mailto:" + email;
                    }
                });
            })();
        </script>
    </body>
</html>
