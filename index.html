        <style>
            :root {
                --ink: #05030b;
                --pink: 255, 64, 190;
                --cyan: 90, 226, 255;
                --mint: 120, 255, 190;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                background: var(--ink);
            }

            body {
                margin: 0;
                min-height: 100svh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: clamp(2.5rem, 8vh, 4rem);
                padding: clamp(2rem, 8vh, 4rem) 20px;
                background: var(--ink);
                text-align: center;
                font-family: "Chakra Petch", system-ui, sans-serif;
                -webkit-text-size-adjust: 100%;
            }

            /* the little light the tube throws into an otherwise empty room */
            body::before {
                content: "";
                position: fixed;
                inset: -20%;
                z-index: -1;
                pointer-events: none;
                background: radial-gradient(
                    34rem 26rem at 50% 42%,
                    rgba(var(--pink), 0.11),
                    transparent 70%
                );
            }

            /* ---------- the sign ---------- */

            .sign {
                position: relative;
                /* the frame hugs the tube, the way a real sign is bent to fit */
                width: fit-content;
                max-width: 100%;
                padding: clamp(1.4rem, 5vw, 2rem) clamp(1.6rem, 6vw, 2.6rem);
                border: 1.5px solid rgba(255, 214, 242, 0.92);
                border-radius: 14px;
                /* one tight halo, one soft one — a tube is not a floodlight */
                box-shadow:
                    0 0 5px rgba(var(--pink), 0.55),
                    0 0 22px rgba(var(--pink), 0.28),
                    inset 0 0 12px rgba(var(--pink), 0.14);
                animation: strike 1.1s steps(1, end) 1 both;
            }

            /* the frosted plate the tube is mounted on */
            .sign::before {
                content: "";
                position: absolute;
                inset: 0;
                z-index: -1;
                border-radius: inherit;
                background: linear-gradient(
                    158deg,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.015) 55%,
                    rgba(var(--pink), 0.05)
                );
                -webkit-backdrop-filter: blur(18px) saturate(140%);
                backdrop-filter: blur(18px) saturate(140%);
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, 0.22),
                    inset 0 -1px 0 rgba(255, 255, 255, 0.04);
            }

            @supports not (
                (backdrop-filter: blur(1px)) or
                    (-webkit-backdrop-filter: blur(1px))
            ) {
                .sign::before {
                    background: rgba(28, 14, 40, 0.55);
                }
            }

            /* the hardware clamping the tube to the plate */
            .mount {
                position: absolute;
                top: 50%;
                width: 7px;
                height: 15px;
                margin-top: -7.5px;
                border-radius: 2px;
                background: #17111f;
                box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
            }

            .mount.l {
                left: -3px;
            }

            .mount.r {
                right: -3px;
            }

            /* a monoline face is already a tube — light it, don't outline it */
            h1 {
                margin: 0;
                font-family: "Quicksand", system-ui, sans-serif;
                font-weight: 500;
                font-size: clamp(1.6rem, 5.6vw, 2.9rem);
                line-height: 1.3;
                letter-spacing: 0.015em;
                color: #fff2fb;
                text-shadow:
                    0 0 2px rgba(255, 255, 255, 0.9),
                    0 0 9px rgba(var(--pink), 0.75),
                    0 0 24px rgba(var(--pink), 0.4);
            }

            h1 .dot {
                color: #eafcff;
                text-shadow:
                    0 0 2px rgba(255, 255, 255, 0.9),
                    0 0 9px rgba(var(--cyan), 0.85),
                    0 0 22px rgba(var(--cyan), 0.45);
            }

            /* the tube stutters once as it strikes, then holds */
            @keyframes strike {
                0%,
                18%,
                42% {
                    opacity: 0.15;
                }
                10%,
                30%,
                100% {
                    opacity: 1;
                }
            }

            /* ---------- links ---------- */

            .links {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: clamp(0.9rem, 3vw, 1.4rem);
                font-size: 0.95rem;
                letter-spacing: 0.1em;
            }

            .sep {
                color: rgba(255, 255, 255, 0.2);
                font-size: 0.8em;
                user-select: none;
            }

            .link {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 4px 2px;
                border: 0;
                border-bottom: 1px solid transparent;
                background: none;
                color: rgba(var(--cyan), 0.82);
                font: inherit;
                letter-spacing: inherit;
                text-decoration: none;
                cursor: pointer;
                text-shadow: 0 0 10px rgba(var(--cyan), 0.35);
                transition:
                    color 0.18s ease,
                    border-color 0.18s ease,
                    text-shadow 0.18s ease;
            }

            .link > span {
                transition: opacity 0.18s ease;
            }

            /* the swapped-in label floats over the idle one, so the row keeps
               its natural width instead of padding out to the longer label */
            .link .lbl-alt {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                white-space: nowrap;
                opacity: 0;
            }

            .link:hover,
            .link:focus-visible {
                outline: none;
                color: #eafcff;
                border-bottom-color: rgba(var(--cyan), 0.7);
                text-shadow:
                    0 0 2px rgba(255, 255, 255, 0.8),
                    0 0 12px rgba(var(--cyan), 0.8);
            }

            .link:hover .lbl-idle,
            .link:focus-visible .lbl-idle {
                opacity: 0;
            }

            .link:hover .lbl-alt,
            .link:focus-visible .lbl-alt {
                opacity: 1;
            }

            /* copied outranks idle and hover */
            .link.copied,
            .link.copied:hover {
                color: rgb(var(--mint));
                border-bottom-color: rgba(var(--mint), 0.7);
                text-shadow:
                    0 0 2px rgba(255, 255, 255, 0.8),
                    0 0 12px rgba(var(--mint), 0.8);
            }

            .link.copied .lbl-idle {
                opacity: 0;
            }

            .link.copied .lbl-alt {
                opacity: 1;
            }

            .sr-status {
                position: absolute;
                width: 1px;
                height: 1px;
                margin: -1px;
                padding: 0;
                border: 0;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }

            @media (prefers-reduced-motion: reduce) {
                .sign {
                    animation: none;
                }

                .link,
                .link > span {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <main class="sign">
            <span class="mount l" aria-hidden="true"></span>
            <span class="mount r" aria-hidden="true"></span>
            <h1>think twice,<br />code once<span class="dot">.</span></h1>
        </main>

        <nav class="links" aria-label="Profiles and contact">
            <a
                class="link"
                href="https://www.linkedin.com/in/mscamargo/"
                target="_blank"
                rel="noopener"
            >
                <span class="lbl-idle">linkedin</span>
                <span class="lbl-alt" aria-hidden="true">@mscamargo</span>
            </a>

            <span class="sep" aria-hidden="true">·</span>

            <a
                class="link"
                href="https://github.com/mscamargo"
                target="_blank"
                rel="noopener"
            >
                <span class="lbl-idle">github</span>
                <span class="lbl-alt" aria-hidden="true">@mscamargo</span>
            </a>

            <span class="sep" aria-hidden="true">·</span>

            <button
                class="link"
                type="button"
                id="email-btn"
                data-email="mscamargo.dev@gmail.com"
                title="mscamargo.dev@gmail.com"
                aria-label="Copy email mscamargo.dev@gmail.com"
            >
                <span class="lbl-idle">email</span>
                <span class="lbl-alt" aria-hidden="true">copied</span>
            </button>
        </nav>

        <p class="sr-status" role="status" aria-live="polite"></p>

        <script>
            (function () {
                var btn = document.getElementById("email-btn");
                var status = document.querySelector(".sr-status");
                var email = btn.dataset.email;
                var timer;

                function confirmed() {
                    btn.classList.add("copied");
                    status.textContent = "Email copied";
                    clearTimeout(timer);
                    timer = setTimeout(function () {
                        btn.classList.remove("copied");
                        status.textContent = "";
                    }, 1800);
                }

                function legacyCopy() {
                    var input = document.createElement("input");
                    input.value = email;
                    input.setAttribute("readonly", "");
                    input.style.position = "fixed";
                    input.style.opacity = "0";
                    document.body.appendChild(input);
                    input.select();
                    var ok = false;
                    try {
                        ok = document.execCommand("copy");
                    } catch (e) {
                        ok = false;
                    }
                    document.body.removeChild(input);
                    return ok;
                }

                btn.addEventListener("click", function () {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard
                            .writeText(email)
                            .then(confirmed, function () {
                                if (legacyCopy()) confirmed();
                                else window.location.href = "mailto:" + email;
                            });
                    } else if (legacyCopy()) {
                        confirmed();
                    } else {
                        window.location.href = "mailto:" + email;
                    }
                });
            })();
        </script>
    </body>
</html>
