        <style>
            :root {
                --background: #000;
                --foreground: #ededed;
                --gray-600: #8f8f8f;
                --border: #2e2e2e;
                --focus: #52a8ff;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100svh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: var(--background);
                color: var(--foreground);
                font-family: "Geist", ui-sans-serif, system-ui, -apple-system,
                    "Segoe UI", Helvetica, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            main {
                width: min(100%, 560px);
                border: 1px solid var(--border);
            }

            h1 {
                padding: clamp(28px, 7vw, 48px) clamp(16px, 5vw, 40px);
                font-size: clamp(2rem, 11vw, 3.75rem);
                font-weight: 800;
                line-height: 1.05;
                letter-spacing: -0.03em;
                text-align: center;
                text-transform: uppercase;
                text-wrap: balance;
            }

            nav {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                padding: 10px clamp(12px, 3vw, 16px);
                border-top: 1px solid var(--border);
            }

            a {
                color: var(--gray-600);
                font-size: 0.75rem;
                font-weight: 500;
                letter-spacing: 0.06em;
                text-decoration: none;
                text-transform: uppercase;
                transition: color 0.15s ease;
            }

            a:hover,
            a:focus-visible {
                color: var(--foreground);
            }

            a:focus-visible {
                outline: 1px solid var(--focus);
                outline-offset: 4px;
            }

            @media (prefers-reduced-motion: reduce) {
                a {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Think twice,<br />code once.</h1>

                    target="_blank"
                    rel="noopener noreferrer"

                    target="_blank"
                    rel="noopener noreferrer"
                    >GitHub</a
                >

            </nav>
        </main>
    </body>
