<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta
            name="description"

        />
        <meta name="author" content="Marcos Camargo" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#08080c" />
        <link rel="canonical" href="https://mscamargo.dev/" />

        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://mscamargo.dev/" />
        <meta property="og:title" content="Marcos Camargo" />
        <meta
            property="og:description"
            content="Marcos Camargo — backend engineer. think twice, code once."
        />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Marcos Camargo" />
        <meta
            name="twitter:description"
            content="Marcos Camargo — backend engineer. think twice, code once."
        />

        <link rel="icon" type="image/png" sizes="32x32" href="icon.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
        <link rel="apple-touch-icon" href="icon-192.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
        />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Marcos Camargo",
                "url": "https://mscamargo.dev",
                "jobTitle": "Backend Engineer",
                "email": "mailto:mscamargo.dev@gmail.com",
                "sameAs": [
                    "https://github.com/mscamargo",
                    "https://www.linkedin.com/in/mscamargo/",
                    "https://www.youtube.com/@mscamargo",
                    "https://www.instagram.com/omscamargo.dev"
                ]
            }
        </script>

        <style>
            :root {
                --bg: #08080c;
                --fg: #eef1f4;
                --muted: #8a8a99;

                /* cyan accent, used sparingly */
                --tube: #2de2ff;
                --glow: #0bd7ff;
                --tube-dim: rgba(45, 226, 255, 0.28);
                --ok: #6bffb0;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100svh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 48px 20px;
                background: var(--bg);
                color: var(--fg);
                text-align: center;
                overflow-x: hidden;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    "Helvetica Neue",
                    Arial,
                    sans-serif;
                -webkit-text-size-adjust: 100%;
            }

            /* faint radial wash behind the content, static */
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                background: radial-gradient(
                    55% 45% at 50% 44%,
                    rgba(11, 215, 255, 0.04),
                    transparent 70%
                );
            }

            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: clamp(2.25rem, 7vh, 3.75rem);
            }

            /* Headline: clean display type, neon only as a small accent */
            h1 {
                margin: 0;
                font-family: "Space Grotesk", system-ui, sans-serif;
                font-weight: 700;
                font-size: clamp(2rem, 8vw, 4.25rem);
                letter-spacing: -0.03em;
                line-height: 1.1;
                color: var(--fg);
                text-shadow: 0 0 14px rgba(11, 215, 255, 0.12);
            }

            /* the trailing period is the one bit of real neon */
            h1 .dot {
                color: var(--tube);
                text-shadow:
                    0 0 4px var(--tube),
                    0 0 12px var(--glow),
                    0 0 28px var(--glow);
            }

            /* Buttons */
            .btns {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 14px 18px;
            }

            .btn {
                /* both labels share one grid cell so width never jumps */
                display: grid;
                grid-template-areas: "l";
                place-items: center;
                padding: 10px 22px;
                border: 1px solid var(--tube-dim);
                border-radius: 10px;
                background: transparent;
                color: var(--tube-dim);
                font: inherit;
                font-size: 0.95rem;
                letter-spacing: 0.02em;
                text-decoration: none;
                cursor: pointer;
                transition:
                    color 0.18s ease,
                    border-color 0.18s ease,
                    box-shadow 0.18s ease;
            }

            .btn > span {
                grid-area: l;
                transition: opacity 0.18s ease;
            }

            .btn .lbl-hover,
            .btn .lbl-copied {
                opacity: 0;
            }

            .btn:hover,
            .btn:focus-visible {
                outline: none;
                color: var(--tube);
                border-color: var(--tube);
                box-shadow:
                    0 0 4px rgba(11, 215, 255, 0.5),
                    0 0 12px rgba(11, 215, 255, 0.35);
                text-shadow: 0 0 6px rgba(11, 215, 255, 0.45);
            }

            .btn:hover .lbl-idle,
            .btn:focus-visible .lbl-idle {
                opacity: 0;
            }

            .btn:hover .lbl-hover,
            .btn:focus-visible .lbl-hover {
                opacity: 1;
            }

            /* copied state wins over idle/hover */
            .btn.copied {
                color: var(--ok);
                border-color: var(--ok);
                box-shadow:
                    0 0 4px rgba(107, 255, 176, 0.5),
                    0 0 12px rgba(107, 255, 176, 0.35);
                text-shadow: 0 0 6px rgba(107, 255, 176, 0.45);
            }

            .btn.copied .lbl-idle,
            .btn.copied .lbl-hover {
                opacity: 0;
            }

            .btn.copied .lbl-copied {
                opacity: 1;
            }

            .sr-status {
                position: absolute;
                width: 1px;
                height: 1px;
                margin: -1px;
                padding: 0;
                border: 0;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }

            @media (max-width: 480px) {
                .btns {
                    flex-direction: column;
                    align-items: stretch;
                    width: 100%;
                    max-width: 20rem;
                }

                .btn {
                    width: 100%;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .btn,
                .btn > span {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>think twice, code once<span class="dot">.</span></h1>

            <nav class="btns" aria-label="Profiles and contact">
                <a
                    class="btn"
                    href="https://www.linkedin.com/in/mscamargo/"
                    target="_blank"
                    rel="noopener"
                >
                    <span class="lbl-idle">linkedin</span>
                    <span class="lbl-hover" aria-hidden="true">@mscamargo</span>
                </a>

                <a
                    class="btn"
                    href="https://github.com/mscamargo"
                    target="_blank"
                    rel="noopener"
                >
                    <span class="lbl-idle">github</span>
                    <span class="lbl-hover" aria-hidden="true">@mscamargo</span>
                </a>

                <button
                    class="btn"
                    type="button"
                    id="email-btn"
                    data-email="mscamargo.dev@gmail.com"
                    aria-label="Copy email mscamargo.dev@gmail.com"
                >
                    <span class="lbl-idle">email</span>
                    <span class="lbl-hover" aria-hidden="true"
                        >mscamargo.dev@gmail.com</span
                    >
                    <span class="lbl-copied" aria-hidden="true">copied</span>
                </button>
            </nav>

            <p class="sr-status" role="status" aria-live="polite"></p>
        </main>

        <script>
            (function () {
                var btn = document.getElementById("email-btn");
                var status = document.querySelector(".sr-status");
                var email = btn.dataset.email;
                var timer;

                function confirmed() {
                    btn.classList.add("copied");
                    status.textContent = "Email copied";
                    clearTimeout(timer);
                    timer = setTimeout(function () {
                        btn.classList.remove("copied");
                        status.textContent = "";
                    }, 1800);
                }

                function legacyCopy() {
                    var input = document.createElement("input");
                    input.value = email;
                    input.setAttribute("readonly", "");
                    input.style.position = "fixed";
                    input.style.opacity = "0";
                    document.body.appendChild(input);
                    input.select();
                    var ok = false;
                    try {
                        ok = document.execCommand("copy");
                    } catch (e) {
                        ok = false;
                    }
                    document.body.removeChild(input);
                    return ok;
                }

                btn.addEventListener("click", function () {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(email).then(confirmed, function () {
                            if (legacyCopy()) confirmed();
                            else window.location.href = "mailto:" + email;
                        });
                    } else if (legacyCopy()) {
                        confirmed();
                    } else {
                        window.location.href = "mailto:" + email;
                    }
                });
            })();
        </script>
    </body>
</html>
